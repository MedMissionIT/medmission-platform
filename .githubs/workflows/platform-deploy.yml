name: Platform Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - prod

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    
    # Map GitHub Environment for protection rules (approvals)
    environment: ${{ github.event.inputs.environment || 'staging' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: Deploy Platform via Task
        env:
          # Inject secrets directly into the environment for Task to pick up
          ENV: ${{ github.event.inputs.environment || 'staging' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Initialize Helm Repos
          task helm:repos
          
          # 2. Install Infrastructure (ArgoCD)
          task install:argocd
          
          # 3. Deploy Platform Stack (Ingress, Monitoring, etc.)
          task install:platform
          
          # 4. Trigger GitOps Synchronization
          task deploy:gitops

      - name: Run Post-Deployment Health Check
        run: task cluster:health