# --- 0. NAMESPACE & STORAGE ---
apiVersion: v1
kind: Namespace
metadata:
  name: medmission
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-pvc
  namespace: medmission
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 8Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openmrs-data-pvc
  namespace: medmission
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: metabase-data-pvc
  namespace: medmission
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 2Gi

---
# --- 1. BASE DE DONNÉES (MARIADB) ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmrs-db
  namespace: medmission
spec:
  strategy:
    type: Recreate # Important pour les DB avec un seul volume RWO
  selector:
    matchLabels:
      app: openmrs-db
  template:
    metadata:
      labels:
        app: openmrs-db
    spec:
      containers:
      - name: mariadb
        image: mariadb:10.11.7
        args: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
        env:
        - name: MYSQL_DATABASE
          value: "openmrs"
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef: { name: openmrs-db-secrets, key: OMRS_DB_USER }
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef: { name: openmrs-db-secrets, key: OMRS_DB_PASSWORD }
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef: { name: openmrs-db-secrets, key: MYSQL_ROOT_PASSWORD }
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/mysql
        livenessProbe:
          exec:
            command: ["mysqladmin", "ping", "-h", "localhost"]
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: mariadb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: medmission
spec:
  selector:
    app: openmrs-db
  ports:
    - port: 3306
      targetPort: 3306

---
# --- 2. BACKEND OPENMRS ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmrs-backend
  namespace: medmission
spec:
  selector:
    matchLabels:
      app: openmrs-backend
  template:
    metadata:
      labels:
        app: openmrs-backend
    spec:
      containers:
      - name: backend
        image: openmrs/openmrs-reference-application-3-backend:qa
        env:
        - name: OMRS_CONFIG_CONNECTION_SERVER
          value: "db"
        - name: OMRS_CONFIG_CONNECTION_DATABASE
          value: "openmrs"
        - name: OMRS_CONFIG_CREATE_TABLES
          value: "true"
        - name: OMRS_CONFIG_AUTO_UPDATE_DATABASE
          value: "true"
        - name: OMRS_CONFIG_CONNECTION_USERNAME
          valueFrom:
            secretKeyRef: { name: openmrs-db-secrets, key: OMRS_DB_USER }
        - name: OMRS_CONFIG_CONNECTION_PASSWORD
          valueFrom:
            secretKeyRef: { name: openmrs-db-secrets, key: OMRS_DB_PASSWORD }
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: backend-data
          mountPath: /openmrs/data
        readinessProbe:
          httpGet:
            path: /openmrs/
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
      volumes:
      - name: backend-data
        persistentVolumeClaim:
          claimName: openmrs-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: medmission
spec:
  selector:
    app: openmrs-backend
  ports:
    - port: 8080
      targetPort: 8080

---
# --- 3. FRONTEND OPENMRS ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmrs-frontend
  namespace: medmission
spec:
  selector:
    matchLabels:
      app: openmrs-frontend
  template:
    metadata:
      labels:
        app: openmrs-frontend
    spec:
      containers:
      - name: frontend
        image: openmrs/openmrs-reference-application-3-frontend:qa
        env:
        - name: SPA_PATH
          value: "/openmrs/spa"
        - name: API_URL
          value: "/openmrs"
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: medmission
spec:
  selector:
    app: openmrs-frontend
  ports:
    - port: 80
      targetPort: 80

---
# --- 4. METABASE ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabase
  namespace: medmission
spec:
  selector:
    matchLabels:
      app: metabase
  template:
    metadata:
      labels:
        app: metabase
    spec:
      containers:
      - name: metabase
        image: metabase/metabase:latest
        env:
        - name: MB_DB_TYPE
          value: "mysql"
        - name: MB_DB_DBNAME
          value: "openmrs"
        - name: MB_DB_PORT
          value: "3306"
        - name: MB_DB_USER
          value: "root"
        - name: MB_DB_PASS
          valueFrom:
            secretKeyRef: { name: openmrs-db-secrets, key: MYSQL_ROOT_PASSWORD }
        - name: MB_DB_HOST
          value: "db"
        - name: MB_SITE_URL
          value: "https://v34924.1blu.de/metabase"
        ports:
        - containerPort: 3000
        volumeMounts:
        - name: metabase-storage
          mountPath: /metabase-data
      volumes:
      - name: metabase-storage
        persistentVolumeClaim:
          claimName: metabase-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: metabase-service
  namespace: medmission
spec:
  selector:
    app: metabase
  ports:
    - port: 3000
      targetPort: 3000

---
# --- 5. INGRESS (NGINX) ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openmrs-ingress
  namespace: medmission
  annotations:
    kubernetes.io/ingress.class: nginx
    # On évite le rewrite-target radical pour ne pas casser les assets relatifs du SPA
spec:
  rules:
  - host: v34924.1blu.de
    http:
      paths:
      - path: /metabase
        pathType: Prefix
        backend:
          service:
            name: metabase-service
            port:
              number: 3000
      - path: /openmrs/spa
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
      - path: /openmrs
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8080