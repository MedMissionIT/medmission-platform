version: '3'

# Multi-Environment Strategy:
# Loads .env.dev by default, or .env.staging / .env.prod based on the ENV variable.
vars:
  ENV: '{{.ENV | default "dev"}}'
  KUBECONFIG: '{{.KUBECONFIG | default "~/.kube/config"}}'
  
  # Project Namespaces
  ARGOCD_NS: "argocd"
  MONITORING_NS: "monitoring"
  INGRESS_NS: "ingress-nginx"
  CERT_MANAGER_NS: "cert-manager"

  # Binaries
  HELM: "helm"
  KUBECTL: "kubectl"

  # Values Path Helper
  VALUES_BASE: "helm-values/base"
  VALUES_ENV: "helm-values/{{.ENV}}"

# Dynamic environment file loading
dotenv: ['.env.{{.ENV}}']

tasks:

  default:
    silent: true
    cmds:
      - task: help

  help:
    desc: "Show help and list of available commands."
    cmds:
      - task --list
    silent: true

  # --- 1. Validation & Security ---

  check:context:
    internal: true
    desc: "Verify execution context to prevent accidental production errors."
    cmds:
      - echo "Target Environment --> {{.ENV | yellow | bold}}"
      - |
        if [ "{{.ENV}}" == "prod" ]; then
          echo "⚠️  WARNING: Targeting PRODUCTION environment ⚠️" | grep --color ".*"
        fi
    silent: true

  check:env-vars:
    internal: true
    desc: "Verify presence of critical secrets before execution."
    preconditions:
      - sh: '[ -n "{{.GITHUB_TOKEN}}" ]'
        msg: "FATAL: GITHUB_TOKEN missing in .env.{{.ENV}}. Installation aborted."
    silent: true

  # --- 2. Helm Management ---

  helm:repos:
    desc: "Configure official Helm repositories."
    internal: true
    cmds:
      - "{{.HELM}} repo add argo https://argoproj.github.io/argo-helm"
      - "{{.HELM}} repo add ingress-nginx https://kubernetes.github.io/ingress-nginx"
      - "{{.HELM}} repo add jetstack https://charts.jetstack.io"
      - "{{.HELM}} repo add prometheus-community https://prometheus-community.github.io/helm-charts"
      - "{{.HELM}} repo add grafana https://grafana.github.io/helm-charts"
      - "{{.HELM}} repo update"
    silent: true

  # --- 3. Bootstrap & Provisioning ---

  bootstrap:k3s:
    desc: "Install local K3s cluster."
    cmds:
      - bash bootstrap/install-k3s.sh

  bootstrap:all:
    desc: "🚀 Full provisioning (Cluster + Helm + Repos)."
    cmds:
      - task: bootstrap:k3s
      - task: bootstrap:helm
      - task: helm:repos

  # --- 4. Core Infrastructure (ArgoCD) ---

  install:argocd:
