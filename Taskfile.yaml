  # --- 5. Platform Stack (Multi-Env) ---

  install:ingress:
    desc: "Deploy Ingress-Nginx using Layered Values."
    deps: [helm:repos]
    cmds:
      - >
        {{.HELM}} upgrade --install ingress-nginx ingress-nginx/ingress-nginx
        -f {{.VALUES_BASE}}/ingress-nginx.yaml
        -f {{.VALUES_ENV}}/ingress-nginx.yaml
        -n {{.INGRESS_NS}} --create-namespace

  install:monitoring:
    desc: "Deploy Prometheus Stack using Layered Values."
    deps: [helm:repos]
    cmds:
      - >
        {{.HELM}} upgrade --install monitoring prometheus-community/kube-prometheus-stack
        -f {{.VALUES_BASE}}/prometheus.yaml
        -f {{.VALUES_ENV}}/prometheus.yaml
        -n {{.MONITORING_NS}} --create-namespace

  install:platform:
    desc: "Install full stack (Ingress, Monitoring, Logging)."
    deps:
      - install:ingress
      - install:monitoring
    cmds:
      - echo "Platform stack successfully deployed on {{.ENV}}"

  # --- 6. Observability & Maintenance ---

  cluster:health:
    desc: "🩺 Global health check (Nodes & Pods)."
    cmds:
      - "{{.KUBECTL}} get nodes"
      - "{{.KUBECTL}} get pods -A"

  destroy:
    desc: "💣 DANGER: Complete cluster decommissioning."
    preconditions:
      - sh: '[ "{{.ENV}}" != "prod" ]'
        msg: "❌ FORBIDDEN ACTION: Production decommissioning via Task is disabled."
    prompt: "Are you sure you want to delete the {{.ENV}} cluster?"
    cmds:
      - k3s-uninstall.sh

