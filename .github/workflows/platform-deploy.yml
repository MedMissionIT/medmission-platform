name: Platform Deployment

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment'
        required: true
        default: 'staging'
        type: choice
        options: [staging, prod]

jobs:
  security-scan:
    name: Security & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Scan Kubernetes manifests & Helm values for misconfigurations
      - name: Run Trivy Config Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-progress: false
          format: 'table'
          exit-code: '1' # Fails the build if high/critical issues are found
          severity: 'HIGH,CRITICAL'

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    needs: security-scan # Wait for security scan to pass
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}
          # 'azure/k8s-set-context' action to utilize the 
          # KUBE_CONFIG secret

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Deploy Platform via Task
        env:
          ENV: ${{ github.event.inputs.environment || 'staging' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          task helm:repos
          task install:argocd
          task install:platform
          task deploy:gitops

      - name: Health Check
        run: task cluster:health